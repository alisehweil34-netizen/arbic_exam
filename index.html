<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخليل في اللغة العربية – اختبار ضع دائرة</title>
<style>
:root{--bg:#f6f0e0;--card:#fffaf0;--ink:#1f2a24;--mute:#6b6a5c;--green:#1d5e3f;--gold:#b8923a;--ok:#2e7d4f;--bad:#b3392f;--line:#e2d6b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1c2b23;--ink:#f1ead6;--mute:#a9a690;--green:#4fb583;--gold:#d8b45a;--ok:#5ec98a;--bad:#ef7b70;--line:#34493d}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1c2b23;--ink:#f1ead6;--mute:#a9a690;--green:#4fb583;--gold:#d8b45a;--ok:#5ec98a;--bad:#ef7b70;--line:#34493d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;font-size:19px;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:18px 12px;background:var(--green);color:#fff;border-radius:14px;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
h2{margin:0 0 10px;font-size:1.15rem;color:var(--green)}
.units{display:grid;gap:10px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;text-align:right}
.unit[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.unit small{color:var(--mute)}
.btn{display:inline-block;padding:10px 22px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}
.btn.alt{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:6px}
.q{font-weight:700;font-size:1.2rem;margin:14px 0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;text-align:right;width:100%}
.opt .c{flex:none;width:34px;height:34px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:.95rem;color:var(--gold);font-weight:700}
.opt:not(:disabled):hover{border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.ok .c{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.opt.bad .c{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:12px;font-weight:700}
.score{font-size:3rem;text-align:center;color:var(--green);margin:6px 0}
.hide{display:none}
.top{display:flex;justify-content:flex-end}
</style>
</head>

<div class="wrap">
<header><h1>الخليل في اللغة العربية</h1><p>اختبار «ضع دائرة حول رمز الإجابة الصحيحة» – الفصل الأول</p></header>

<section id="home" class="card">
<h2>اختر الوحدات</h2>
<div class="units" id="units"></div>
<button class="btn" id="start">ابدأ الاختبار</button>
</section>

<section id="quiz" class="card hide">
<div class="meta"><span id="num"></span><span id="sc"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="q" id="q"></div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
<button class="btn" id="next" disabled>التالي</button>
</section>

<section id="end" class="card hide">
<h2>النتيجة</h2>
<div class="score" id="final"></div>
<p id="msg" style="text-align:center"></p>
<div style="text-align:center"><button class="btn" id="again">أعد المحاولة</button> <button class="btn alt" id="menu">القائمة</button></div>
</section>
</div>

const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const L=["أ","ب","ج","د"];
let sel=new Set([1,2]),Q=[],i=0,s=0,done=false;
function drawUnits(){
 $("units").innerHTML="";
 for(const k in U){const n=D.filter(d=>d[0]==k).length;
  const b=document.createElement("button");b.className="unit";b.setAttribute("aria-pressed",sel.has(+k));
  b.innerHTML="<span>"+U[k]+"</span><small>"+n+" سؤالًا</small>";
  b.onclick=()=>{sel.has(+k)?sel.delete(+k):sel.add(+k);drawUnits();$("start").disabled=!sel.size};
  $("units").appendChild(b)}
}
function show(id){["home","quiz","end"].forEach(x=>$(x).classList.toggle("hide",x!=id))}
function start(){
 Q=sh(D.filter(d=>sel.has(d[0]))).map(d=>({q:d[1],a:d[2],o:sh(d.slice(2))}));
 i=0;s=0;show("quiz");ask();
}
function ask(){
 done=false;const x=Q[i];
 $("num").textContent="السؤال "+(i+1)+" من "+Q.length;
 $("sc").textContent="الدرجة: "+s;
 $("bar").style.width=(i/Q.length*100)+"%";
 $("q").textContent=x.q;$("fb").textContent="";$("next").disabled=true;
 $("next").textContent=i==Q.length-1?"إظهار النتيجة":"التالي";
 $("opts").innerHTML="";
 x.o.forEach((t,k)=>{
  const b=document.createElement("button");b.className="opt";
  b.innerHTML='<span class="c">'+L[k]+'</span><span></span>';b.lastChild.textContent=t;
  b.onclick=()=>pick(b,t);$("opts").appendChild(b)});
}
function pick(b,t){
 if(done)return;done=true;const x=Q[i];
 [...$("opts").children].forEach(o=>{o.disabled=true;if(o.lastChild.textContent==x.a)o.classList.add("ok")});
 if(t==x.a){s++;$("fb").style.color="var(--ok)";$("fb").textContent="أحسنت! إجابة صحيحة ✓"}
 else{b.classList.add("bad");$("fb").style.color="var(--bad)";$("fb").textContent="إجابة خاطئة، الصحيحة مظلّلة بالأخضر"}
 $("sc").textContent="الدرجة: "+s;$("next").disabled=false;
}
$("next").onclick=()=>{
 if(i<Q.length-1){i++;ask()}
 else{show("end");const p=Math.round(s/Q.length*100);
  $("final").textContent=s+" / "+Q.length+" ("+p+"%)";
  $("msg").textContent=p>=90?"ممتاز! أنت بطل العربية 🌟":p>=70?"جيد جدًا، استمر!":p>=50?"جيد، راجع الدوسية وحاول مرة أخرى":"لا بأس، راجع الدروس وأعد المحاولة"}
};
$("start").onclick=start;$("again").onclick=start;$("menu").onclick=()=>show("home");
drawUnits();
</script>
